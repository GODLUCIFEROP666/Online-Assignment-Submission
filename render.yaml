services:
  - type: web
    name: final2-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: 25
      - key: ANALYTICS_DB_HOST
        sync: false
      - key: ANALYTICS_DB_USER
        sync: false
      - key: ANALYTICS_DB_PASSWORD
        sync: false
      - key: ANALYTICS_DB_NAME
        sync: false
    disk:
      name: final2-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
